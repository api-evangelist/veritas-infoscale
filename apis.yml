apis:
- aid: veritas-infoscale:operations-manager-api
  name: Veritas InfoScale Operations Manager API
  description: >-
    REST API for centralized monitoring and management of InfoScale environments. Provides meta, query,
    update, and operational endpoints for managing clusters, service groups, hosts, storage, and extended
    attributes across the entire InfoScale infrastructure.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://www.veritas.com/support/en_US/doc/120572053-156079406-0/viom_tot_v96894970-156079406
  baseURL: https://{isom-server}:14161/vom/api
  tags:
