- aid: veritas-infoscale:vcs-api
  name: Veritas Cluster Server API
  description: >-
    API for managing VCS clusters, service groups, and resources within InfoScale. Provides operations
    for cluster node management, service group failover and failback, resource dependency configuration,
    and heartbeat monitoring.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.veritas.com/support/en_US/doc/79638609-166315478-0/v151832379-166315478
