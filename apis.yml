- aid: veritas-infoscale:vxvm-api
  name: Veritas Volume Manager API
  description: >-
    API for storage volume management, including volume creation, resizing, mirroring, and snapshot operations.
    Manages disk groups, plexes, subdisks, and provides advanced storage features like thin provisioning,
    data migration, and volume replication.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.veritas.com/support/en_US/doc/79638609-166315478-0/v151832379-166315478
