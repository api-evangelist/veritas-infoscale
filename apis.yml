- type: Features
  data:
  - name: High Availability Clustering
    description: Provides application-aware clustering with automatic failover and failback to ensure continuous availability
      of mission-critical applications.
  - name: Intelligent Monitoring Framework
    description: Uses asynchronous event-based monitoring (IMF) to detect failures instantaneously, eliminating CPU overhead
      of legacy poll-based monitoring.
  - name: Storage Management
    description: Software-defined storage services for volume management, thin provisioning, data migration, and multi-pathing
      across heterogeneous storage arrays.
  - name: Disaster Recovery
    description: Volume replication (VVR) and file replication (VFR) for real-time data replication across sites with automated
      disaster recovery orchestration.
  - name: Snapshot Management
    description: Space-optimized snapshots for backup, data analytics, forensic discovery, and point-in-time recovery without
      impacting production workloads.
  - name: Kubernetes Integration
    description: Native CSI driver providing persistent storage on DAS and SAN with data integrity using I/O fencing for Kubernetes
      and OpenShift environments.
  - name: Cloud Deployment
    description: Deployment on AWS, Azure, Google Cloud, and Oracle Cloud with solution templates and marketplace offerings
      for elastic scaling.
  - name: REST API Management
    description: Full REST API support for control plane operations enabling automation and integration with DevOps pipelines
      and orchestration tools.
- type: UseCases
  data:
  - name: Application High Availability
    description: Ensure zero-downtime for mission-critical applications like Oracle, SAP, and SQL Server with automatic failover
      and health monitoring.
  - name: Disaster Recovery Automation
    description: Automate cross-site replication and recovery orchestration to meet RPO and RTO requirements for business
      continuity planning.
  - name: Storage Consolidation
    description: Consolidate heterogeneous storage arrays into a unified software-defined storage layer with volume management.
  - name: Cloud Migration
    description: Migrate on-premises applications to cloud environments with consistent storage and availability management
      across hybrid infrastructure.
  - name: Container Storage
    description: Provide enterprise-grade persistent storage for containerized applications on Kubernetes and OpenShift with
      CSI driver integration.
  - name: Database Protection
    description: Protect databases with application-consistent snapshots, online data migration, and real-time replication
      without application downtime.
- type: Integrations
  data:
  - name: Oracle Database
    description: Deep integration with Oracle RAC and single-instance databases for storage management, availability, and
      disaster recovery.
  - name: SAP Applications
    description: Certified integration with SAP HANA and SAP applications for high availability and disaster recovery in enterprise
      environments.
  - name: Microsoft SQL Server
    description: High availability and storage management for SQL Server Always On availability groups and failover cluster
      instances.
  - name: VMware vSphere
    description: Integration with VMware vSphere and vSAN for virtualized application availability and storage management.
  - name: Kubernetes and OpenShift
    description: CSI driver integration for persistent storage provisioning and management in container orchestration platforms.
  - name: Ansible Automation
    description: Ansible modules for automated deployment, configuration, and management of InfoScale environments in DevOps
      pipelines.
  - name: Dell EMC Storage
    description: SRDF MetroCluster support with Dell EMC PowerMax and vMAX arrays for storage replication and disaster recovery.
  - name: AWS and Azure
    description: Cloud marketplace offerings and solution templates for deployment on Amazon Web Services and Microsoft Azure
      platforms.
